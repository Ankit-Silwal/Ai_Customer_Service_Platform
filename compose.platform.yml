name: relay
x-app: &app
  build:
    context: .
    dockerfile: Dockerfile.platform
  env_file: .env.platform
  environment: &environment
    DATABASE_URL: postgresql://relay:${RELAY_DB_PASSWORD:?Set RELAY_DB_PASSWORD in .env.platform}@postgres:5432/relay
    S3_ENDPOINT: http://storage:9000
    KNOWLEDGE_URL: http://knowledge:4101
  restart: unless-stopped
  init: true
  depends_on:
    migrate:
      condition: service_completed_successfully
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: ${RELAY_DB_PASSWORD:?Set RELAY_DB_PASSWORD in .env.platform}
      POSTGRES_DB: relay
    ports: ["127.0.0.1:5440:5432"]
    volumes: [relay_postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relay -d relay"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  storage:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY in .env.platform}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in .env.platform}
    ports: ["127.0.0.1:9100:9000", "127.0.0.1:9101:9001"]
    volumes: [relay_storage:/data]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  migrate:
    build:
      context: .
      dockerfile: Dockerfile.platform
    env_file: .env.platform
    environment: *environment
    command: ["npm", "run", "db:migrate", "--workspace", "@relay/server"]
    depends_on:
      postgres:
        condition: service_healthy
      storage:
        condition: service_healthy
  api:
    <<: *app
    command: ["npm", "run", "start", "--workspace", "@relay/api"]
    ports: ["127.0.0.1:4100:4100"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      knowledge:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:4100/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
  knowledge:
    <<: *app
    command: ["npm", "run", "start", "--workspace", "@relay/knowledge"]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:4101/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
  worker:
    <<: *app
    command: ["npm", "run", "start", "--workspace", "@relay/worker"]
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports: ["127.0.0.1:3000:8080"]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
volumes:
  relay_postgres:
  relay_storage:
